# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Bounded timeouts for the JDK's own HTTP stack (sun.net.www.protocol.http.*).
# NeoGradle resolves the `net.neoforged:neoforge` dependency during the CONFIGURATION
# phase and, as part of that, always revalidates Mojang's launcher metadata
# (https://piston-meta.mojang.com/mc/game/version_manifest.json) with a bare
# HttpURLConnection that sets no timeouts of its own. With no timeout a black-holed
# connection blocks configuration indefinitely; on a flaky link it fails with an
# IOException that aborts the build and surfaces as the misleading cascade error
# "(The run type 'client' was not found)". These bounds turn a silent hang into a
# fast, retryable failure. 0 (the JDK default) means "wait forever".
systemProp.sun.net.client.defaultConnectTimeout=20000
systemProp.sun.net.client.defaultReadTimeout=120000

# NeoGradle would add a server, data and game-test run of its own; the mod is
# client side only, so build.gradle declares the client run and nothing else.
neogradle.subsystems.conventions.runs.create-default-run-per-type=false

# Parchment mappings (optional, for better parameter names in decompiled sources)
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.248
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)
# JEI API for 1.21.1 (compile-only, used by the soft JEI integration)
jei_version=19.57.0.447

## Mod Properties
mod_id=craftplanner
mod_name=Craft Planner
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.craftplanner
