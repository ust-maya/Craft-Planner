modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
showAsResourcePack=false

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Igor"
description='''Craft Planner — визуализатор дерева крафта. Добавляйте рецепты из EMI/JEI или инвентаря горячей клавишей и смотрите дерево с подсветкой дефицита ресурсов.'''

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

# Soft, client-side integrations: the mod works without them (Stage 5).
# The version ranges pin the major each API was written against: EMI
# (EmiApi.getHoveredStack) and JEI (IModPlugin) have changed signatures
# across majors before, and an unbounded range would let a future
# incompatible release pass the dependency check. Bump these deliberately
# when the integration is re-verified.
[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[1.0.0,2.0.0)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19.0.0,20.0.0)"
ordering="NONE"
side="CLIENT"
