modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
showAsResourcePack=false

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Igor"
description='''Craft Planner — визуализатор дерева крафта. Добавляй рецепты из EMI/JEI или инвентаря хоткеем и смотри дерево крафта с подсветкой дефицита ресурсов.'''

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
mandatory=true
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

# Soft, client-side integrations: the mod works without them (Stage 5).
[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[0,)"
ordering="NONE"
side="CLIENT"
