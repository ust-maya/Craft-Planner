# Smithing recipes keep their inputs in package-private fields and never
# override Recipe#getIngredients(), which therefore returns an empty list.
# Without these three fields the planner sees a smithing recipe with no
# ingredients and marks a craftable item (the whole netherite set) as raw
# material. See com.craftplanner.engine.RecipeIngredients.
#
# NeoForge discovers this file at META-INF/accesstransformer.cfg by default;
# NeoGradle applies it to the compile classpath through the
# minecraft.accessTransformers block in build.gradle.
