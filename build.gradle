plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

// The jar carries the Minecraft version it targets: craftplanner-1.21.1-1.0.0.jar.
base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Smithing recipes never expose their inputs through Recipe#getIngredients()
// (template/base/addition are package-private and NeoForge does not open them),
// so the engine reads those fields directly and the compiler needs them public
// — see com.craftplanner.engine.RecipeIngredients. NeoForge picks the same file
// up at runtime from META-INF inside the jar.
minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}

repositories {
    // JEI publishes its API here (compile-only dependency, see below).
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
    }

    server {
        argument '--nogui'
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // The layouts under client.tree and client.screen are plain arithmetic over a
    // text-width function, so their tests need the main classes — and nothing
    // else of the game.
    testImplementation.extendsFrom implementation
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    // EMI integration is soft: com.craftplanner.integration reaches EMI through
    // reflection, so no compile-time dependency is required and the mod runs
    // fine without it.
    // compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    // localRuntime "dev.emi:emi-neoforge:${emi_version}"

    // JEI hands its runtime only to a registered plugin (@JeiPlugin +
    // IModPlugin), which cannot be written against reflection. The API is
    // compile-only: com.craftplanner.integration.JeiRuntimePlugin is loaded
    // exclusively by JEI itself, so nothing breaks when JEI is missing.
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:${jei_version}"
}

// Expand declared properties in neoforge.mods.toml
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// The tree and list layouts are testable without a game; see client/tree.
test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
