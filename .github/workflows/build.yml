name: Build

# The mod builds against NeoForge and Minecraft artifacts, so the job only needs
# a JDK 21 and network access to the public Maven repositories.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle re-downloads the decompiled Minecraft artifacts otherwise; the
      # wrapper distribution and the build cache make the second run fast.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build test --no-daemon --stacktrace

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: craftplanner-jar
          path: build/libs/*.jar
